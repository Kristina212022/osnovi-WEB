</head>

    <button id="startBtn" onclick="startRace()">Започни трка</button>

                <th>Позиција</th>

            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
    <br>

    <h3>НАСТАНИ:</h3>
    <div id="logBox" style="border: 1px solid rgb(255, 2, 2); padding: 10px; height: 150px; overflow-y: scroll;">
    </div>
    <script src="script.js"></script>

</html>
